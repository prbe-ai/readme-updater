name: 'AI README Updater (agentic)'
description: 'A Claude agent investigates recent commits/PRs with git + gh and updates README.md, committing only if the README is the sole change.'
author: 'prbe-ai'

branding:
  icon: 'book-open'
  color: 'purple'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key. Store it as a repo/org secret and pass via with:. Never hardcode it.'
    required: true
  model:
    description: 'Claude model id. Defaults to a cheap one (Haiku).'
    required: false
    default: 'claude-haiku-4-5'
  since:
    description: "Investigation window the agent is told to look back over (e.g. '1 day ago', '7 days ago')."
    required: false
    default: '1 day ago'
  readme-path:
    description: 'Path to the README file to maintain. The agent may change ONLY this file.'
    required: false
    default: 'README.md'
  max-turns:
    description: 'Hard ceiling on agent turns — a runaway-loop backstop, NOT a normal-run limit. Real runs finish in ~7-25 turns; the default is set far above that so it only trips on a runaway.'
    required: false
    default: '100'
  commit:
    description: "If 'true', commit and push when README is the sole change. If 'false', leave the edit in the working tree."
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message used when committing.'
    required: false
    default: 'docs: auto-update README from recent commits [skip ci]'

runs:
  using: 'composite'
  steps:
    - name: Record base commit
      shell: bash
      run: echo "RU_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Investigate changes and edit the README
      # Pinned to a full SHA (resolves to v1) per the claude-code-action security advisory:
      # don't trust a moving tag for an agent that reads attacker-influenceable commit text.
      uses: anthropics/claude-code-action@64de744025ca9e24df2b88204b4f1e968f39f009
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ github.token }}
        prompt: |
          You maintain the README for this repository. Investigate what changed in
          roughly the last "${{ inputs.since }}" and update ${{ inputs.readme-path }}
          ONLY where it materially matters to users.

          Investigate (read-only) before writing anything:
          - Run: git log --since="${{ inputs.since }}" --no-merges --stat
            then git show <sha> / git diff on the commits that look user-facing.
          - Use: gh pr list --state merged --limit 30  and  gh pr view <n>
            to understand the intent behind merged PRs; gh issue view <n> for any
            referenced issue.
          - Open the touched source files with Read to confirm the REAL behavior.
            Never trust a commit message alone.

          Then edit ${{ inputs.readme-path }} to match reality:
          - Only change what the work actually justifies (features, usage, flags,
            config, install, behavior changes, removals, versions). Invent nothing.
          - Preserve the existing structure, tone, badges and HTML-comment markers
            verbatim; do not reflow text you are not changing.
          - If nothing in the window warrants a change, make NO edits.

          HARD RULES (a later step enforces these and will revert violations):
          - Edit ONLY ${{ inputs.readme-path }}. Do not modify, create, or delete any
            other file.
          - Do NOT commit, push, or open a pull request. Leave your edit in the
            working tree; a later step decides whether to commit.
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools "Read,Edit,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh api:*)"

    - name: Commit only if the README is the sole change
      shell: bash
      env:
        README_PATH: ${{ inputs.readme-path }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        DO_COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        BASE="${RU_BASE_SHA:-$(git rev-parse HEAD)}"

        # Union of uncommitted edits and any commits the agent may have made since BASE.
        UNCOMMITTED="$(git status --porcelain | sed -E 's/^...//; s/.* -> //')"
        COMMITTED="$(git diff --name-only "$BASE" HEAD)"
        CHANGED="$(printf '%s\n%s\n' "$UNCOMMITTED" "$COMMITTED" | sed '/^$/d' | sort -u)"

        if [ -z "$CHANGED" ]; then
          echo "No changes — nothing to commit."; exit 0
        fi
        echo "Changed paths:"; echo "$CHANGED"

        # ENFORCE: README must be the ONLY changed path, else revert and fail.
        OTHER="$(printf '%s\n' "$CHANGED" | grep -vxF "$README_PATH" || true)"
        if [ -n "$OTHER" ]; then
          echo "::error::Agent touched files other than $README_PATH — refusing to commit:"
          printf '%s\n' "$OTHER"
          git reset --hard "$BASE"
          exit 1
        fi

        if [ "$DO_COMMIT" != "true" ]; then
          echo "commit=false — leaving the README edit in the working tree."; exit 0
        fi

        # Collapse any agent commits back to BASE, keeping the README change staged.
        git reset --soft "$BASE"
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$README_PATH"

        EXTRA="$(git diff --cached --name-only | grep -vxF "$README_PATH" || true)"
        if [ -n "$EXTRA" ]; then
          echo "::error::Unexpected staged files after normalize: $EXTRA"; git reset --hard "$BASE"; exit 1
        fi
        if git diff --cached --quiet; then
          echo "Nothing staged — no README change to commit."; exit 0
        fi

        git commit -m "$COMMIT_MESSAGE"
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "Committed README update."
