name: README auto-update (AI)

# Dogfood: this repo keeps its own README current using the action it ships.
# It doubles as a live, copy-pasteable example of how to consume the action.

on:
  schedule:
    - cron: '0 6 * * *'      # daily 06:00 UTC — adjust to taste (cron is UTC)
  workflow_dispatch: {}        # also run on demand from the Actions tab

permissions:
  contents: write              # so the action can push the README change
  pull-requests: read          # so the agent can crawl merged PRs via gh
  issues: read                 # so the agent can crawl referenced issues via gh

concurrency:
  group: readme-auto-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the agent needs history to investigate the window

      - name: Update README
        uses: ./                 # consumers use: prbe-ai/readme-updater@v2
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
