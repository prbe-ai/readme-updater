name: README auto-update (AI)

# Dogfood: this repo keeps its own README current using the action it ships.
# It doubles as a live, copy-pasteable example of how to consume the action.

on:
  schedule:
    - cron: '0 6 * * *'      # daily 06:00 UTC — adjust to taste (cron is UTC)
  workflow_dispatch: {}        # also run on demand from the Actions tab

permissions:
  contents: write              # required so the action can push the README change

concurrency:
  group: readme-auto-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the action needs history to diff the commit window

      - name: Update README
        uses: ./                 # consumers use: prbe-ai/readme-updater@v1
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
